name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and typecheck
        run: npm run lint && npm run typecheck
      - name: Unit tests (content integrity, privacy, SEO)
        run: npm test
      - name: Build (prerendered static site)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (desktop, Android, iPhone, Firefox, Safari engines)
        run: npx playwright test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the live site
        run: |
          set -e
          base="${{ steps.deployment.outputs.page_url }}"
          for path in "" "projects/promptflowengine/" "Vijayraj_Palanisamy_Resume.pdf" "sitemap.xml"; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "${base}${path} -> $code"
            [ "$code" = "200" ]
          done
